name: JUD.M Semantic Director V4 Benchmark

on:
  push:
    branches:
      - feature/semantic-director-v4
  workflow_dispatch:

permissions:
  contents: read

env:
  DRIVE_INBOX_FOLDER_ID: 1o_7Od_lp7lEqbomWdD-tsZ1t1XhfoVnC
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  HF_HOME: ~/.cache/huggingface
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache semantic model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: smolvlm2-256m-v1

      - name: Install base render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig fonts-noto-cjk
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/dohyeon/DoHyeon-Regular.ttf' -o "$HOME/.local/share/fonts/DoHyeon-Regular.ttf"
          fc-cache -f
          pip install -r requirements.txt

      - name: Install CPU semantic dependencies
        run: |
          pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-semantic.txt

      - name: Run semantic unit tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_semantic.py tests/test_director_generic.py tests/test_director_human_editing.py
      - name: Render one real semantic preview
        env:
          PYTHONPATH: src
          JUDM_SEMANTIC_ENABLED: 'true'
          JUDM_SEMANTIC_REQUIRED: 'true'
          JUDM_PREVIEW_INDEX: '0'
        run: |
          set -o pipefail
          start=$(date +%s)
          python -m judm_auto_shorts.preview | tee semantic-preview-result.json
          finish=$(date +%s)
          seconds=$((finish-start))
          echo "semantic_total_seconds=$seconds" | tee semantic-benchmark.txt
          if [ "$seconds" -gt 900 ]; then
            echo "Semantic preview exceeded 15 minute production budget"
            exit 2
          fi

      - name: Upload semantic benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judm-semantic-v4-benchmark
          path: |
            out/edited/*.mp4
            semantic-preview-result.json
            semantic-benchmark.txt
          retention-days: 7
