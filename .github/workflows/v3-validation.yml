name: JUD.M Creative Engine V3 Validation

on:
  push:
    branches:
      - feature/creative-engine-v3
  workflow_dispatch:

permissions:
  contents: read

env:
  DRIVE_INBOX_FOLDER_ID: 1o_7Od_lp7lEqbomWdD-tsZ1t1XhfoVnC
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig fonts-noto-cjk
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL             'https://raw.githubusercontent.com/google/fonts/main/ofl/dohyeon/DoHyeon-Regular.ttf'             -o "$HOME/.local/share/fonts/DoHyeon-Regular.ttf"
          fc-cache -f
          pip install -r requirements.txt

      - name: Run V3 tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Render two real Drive previews
        env:
          PYTHONPATH: src
        run: |
          JUDM_PREVIEW_INDEX=0 python -m judm_auto_shorts.preview | tee preview-result-0.json
          JUDM_PREVIEW_INDEX=1 python -m judm_auto_shorts.preview | tee preview-result-1.json

      - name: Upload V3 previews
        uses: actions/upload-artifact@v4
        with:
          name: judm-v3-preview
          path: |
            out/edited/*.mp4
            preview-result-*.json
          retention-days: 7
